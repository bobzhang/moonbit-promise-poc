name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 5"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [latest, pre-release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "${{ matrix.version }}"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon check --target all --deny-warn
      - run: moon test --target all
      - run: moon test --target all --release
      - name: Check formatting and public interfaces
        run: |
          moon fmt --check
          moon info --target all
          git diff --exit-code
